<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sin conexión | Delasoft</title>
    <style>
      :root {
        --bg-page:   #0b0b0d;
        --bg-card:   #1c1c22;
        --border:    rgba(255, 255, 255, 0.08);
        --text:      #f5f5f7;
        --text-muted:#9a9aa2;
        --brand:     #0878e8;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-page:   #f5f5f7;
          --bg-card:   #ffffff;
          --border:    rgba(0, 0, 0, 0.08);
          --text:      #16161a;
          --text-muted:#6b6b76;
        }
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg-page);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-top: max(24px, env(safe-area-inset-top));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
      }
      .card {
        width: 100%;
        max-width: 360px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 36px 28px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      }
      .icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: rgba(8, 120, 232, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon svg { width: 28px; height: 28px; }
      h1 {
        font-size: 18px;
        font-weight: 800;
        margin: 0 0 8px;
      }
      p {
        font-size: 13px;
        color: var(--text-muted);
        line-height: 1.5;
        margin: 0 0 24px;
      }
      button {
        width: 100%;
        padding: 13px 16px;
        border: none;
        border-radius: 14px;
        background: var(--brand);
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      button:active { opacity: 0.85; }
      .status {
        margin-top: 14px;
        font-size: 11px;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0878e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h1>Sin conexión</h1>
      <p>No se pudo cargar esta página. Revisa tu conexión a internet e intenta de nuevo.</p>
      <button onclick="location.reload()">Reintentar</button>
      <div class="status" id="status">Esperando conexión…</div>
    </div>
    <script>
      // Al volver la conexión, recarga sola.
      window.addEventListener("online", () => location.reload());
      document.getElementById("status").textContent = navigator.onLine
        ? "Conexión detectada, reintenta."
        : "Esperando conexión…";
    </script>
  </body>
</html>
